name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: electronica_tech
          POSTGRES_USER: electronica
          POSTGRES_PASSWORD: electronica_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U electronica -d electronica_tech"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://electronica:electronica_ci@localhost:5432/electronica_tech?schema=public
      JWT_SECRET: ci-secret
      S3_ENDPOINT: http://localhost:9000
      S3_PUBLIC_URL: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: electronica-tech-attachments
      S3_ACCESS_KEY: electronica
      S3_SECRET_KEY: electronica_ci_minio

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=electronica \
            -e MINIO_ROOT_PASSWORD=electronica_ci_minio \
            quay.io/minio/minio server /data

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Wait for MinIO
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO did not become ready in time" >&2
          exit 1

      - name: Create MinIO bucket
        run: |
          docker run --rm --network host --entrypoint sh quay.io/minio/mc:latest -c "
            mc alias set local http://localhost:9000 electronica electronica_ci_minio &&
            mc mb -p local/electronica-tech-attachments
          "

      - name: Prepare database
        working-directory: backend
        run: npm run prisma:migrate -- deploy && npm run prisma:seed

      - name: Backend unit tests
        working-directory: backend
        run: npm test

      - name: Backend e2e tests
        working-directory: backend
        run: npm run test:e2e

      - name: Backend build
        working-directory: backend
        run: npm run build

      - name: Frontend build
        run: npm run build
